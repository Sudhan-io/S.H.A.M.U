[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shamu"
version = "0.1.0"
description = "SHAMU — Personal AI Desktop Assistant for Windows 11"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SHAMU Team"}
]
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "keyring>=24.3.0",
    "rich>=13.7.0",
    "psutil>=6.0.0",
    "pywin32>=306; sys_platform == 'win32'",
    "pywin32-ctypes>=0.2.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyinstaller>=6.5.0",
]
speech = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "onnxruntime>=1.17.0",
    "faster-whisper>=1.0.0",
]
desktop = [
    "PySide6>=6.7.0",
    "uiautomation>=2.0.19",
]
memory = [
    "fastembed>=0.2.0",
]
all = [
    "shamu[speech,desktop,memory,dev]",
]

[project.scripts]
shamu = "shamu.cli:main"
shamu-gui = "shamu.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]

